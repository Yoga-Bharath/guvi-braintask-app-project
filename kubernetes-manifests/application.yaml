apiVersion: v1
kind: Namespace
metadata:
  name: brain-tasks

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: brain-tasks-app
  namespace: brain-tasks

spec:
  replicas: 2

  selector:
    matchLabels:
      app: brain-tasks-app

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app: brain-tasks-app

    spec:
      containers:
        - name: brain-tasks-app
          image: $IMAGE_URI
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 3000
              protocol: TCP

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "256Mi"

          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: brain-tasks-service
  namespace: brain-tasks

  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"

spec:
  type: LoadBalancer

  selector:
    app: brain-tasks-app

  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: 3000
