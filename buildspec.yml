version: 0.2

phases:

  pre_build:
    commands:
      - echo "========================================"
      - echo "PRE-BUILD PHASE"
      - echo "========================================"

      - echo "AWS Region = ${AWS_DEFAULT_REGION}"

      - AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

      - ECR_URI=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/brain-tasks-app

      - IMAGE_TAG=$(echo ${CODEBUILD_RESOLVED_SOURCE_VERSION} | cut -c 1-7)

      - IMAGE_URI=${ECR_URI}:${IMAGE_TAG}

      - echo "AWS Account = ${AWS_ACCOUNT_ID}"
      - echo "ECR URI = ${ECR_URI}"
      - echo "Image Tag = ${IMAGE_TAG}"
      - echo "Image URI = ${IMAGE_URI}"

      - echo "Logging in to Amazon ECR..."

      - aws ecr get-login-password --region ${AWS_DEFAULT_REGION} | docker login --username AWS --password-stdin ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com

  build:
    commands:
      - echo "========================================"
      - echo "BUILD PHASE"
      - echo "========================================"

      - echo "Building Docker image..."

      - docker build -t brain-tasks-app:${IMAGE_TAG} ./Brain-Tasks-App

      - echo "Docker image built successfully."

      - echo "Tagging Docker image..."

      - docker tag brain-tasks-app:${IMAGE_TAG} ${IMAGE_URI}

      - echo "Docker image tagged successfully."

  post_build:
    commands:
      - echo "========================================"
      - echo "POST-BUILD PHASE"
      - echo "========================================"

      - echo "Pushing Docker image to ECR..."

      - docker push ${IMAGE_URI}

      - echo "Docker image pushed successfully."

      - echo "Generating Kubernetes deployment manifest..."

      - sed "s|\$IMAGE_URI|${IMAGE_URI}|g" kubernetes-manifests/application.yaml > application-deploy.yaml

      - echo "Generated deployment manifest:"
      - cat application-deploy.yaml

      - printf '[{"name":"brain-tasks-app","imageUri":"%s"}]' "${IMAGE_URI}" > image-definition.json

      - echo "Build completed successfully."

artifacts:
  files:
    - application-deploy.yaml
    - image-definition.json
