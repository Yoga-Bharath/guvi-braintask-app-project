version: 0.2

phases:

  pre_build:
    commands:
      - echo "========================================"
      - echo "PRE-BUILD PHASE"
      - echo "========================================"

      - echo "AWS Region = ${AWS_DEFAULT_REGION}"

      - AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

      - ECR_URI=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/brain-tasks-app

      - echo "AWS Account = ${AWS_ACCOUNT_ID}"
      - echo "ECR URI = ${ECR_URI}"

      - echo "Logging in to Amazon ECR..."

      - aws ecr get-login-password --region ${AWS_DEFAULT_REGION} | docker login --username AWS --password-stdin ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com

  build:
    commands:
      - echo "========================================"
      - echo "BUILD PHASE"
      - echo "========================================"

      - echo "Building Docker image..."

      - docker build -t brain-tasks-app:latest ./Brain-Tasks-App

      - echo "Docker image built successfully."

      - echo "Tagging Docker image..."

      - docker tag brain-tasks-app:latest ${ECR_URI}:latest

      - echo "Docker image tagged successfully."

  post_build:
    commands:
      - echo "========================================"
      - echo "POST-BUILD PHASE"
      - echo "========================================"

      - echo "Pushing Docker image to ECR..."

      - docker push ${ECR_URI}:latest

      - echo "Docker image pushed successfully."

      - echo "ECR image: ${ECR_URI}:latest"

artifacts:
  files:
    - kubernetes-manifests/application.yaml
